# Production overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.9'

x-production-logging: &production-logging
  driver: "json-file"
  options:
    max-size: "200m"
    max-file: "20"
    compress: "true"
    labels: "service,environment,version"

services:
  # =============================================================================
  # PRODUCTION OVERRIDES
  # =============================================================================
  
  trading:
    image: ${DOCKER_REGISTRY}/aithorix/trading:${VERSION}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: WARNING
      PYTHONOPTIMIZE: 2
      MALLOC_TRIM_THRESHOLD_: 0
      MALLOC_MMAP_THRESHOLD_: 131072
      MALLOC_MMAP_MAX_: 65536
      GODEBUG: madvdontneed=1
    volumes:
      - /mnt/nvme/aithorix/data:/app/data
      - /mnt/nvme/aithorix/logs:/app/logs
      - /mnt/nvme/aithorix/models:/app/data/models/weights
    deploy:
      mode: replicated
      replicas: 3
      placement:
        constraints:
          - node.labels.gpu == true
          - node.labels.zone == primary
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.3
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '8'
          memory: 32G
        reservations:
          cpus: '4'
          memory: 16G
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    logging: *production-logging
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      memlock:
        soft: -1
        hard: -1
    sysctls:
      - net.core.somaxconn=65535
      - net.ipv4.tcp_keepalive_time=600
      - net.ipv4.tcp_keepalive_intvl=60
      - net.ipv4.tcp_keepalive_probes=10

  ml-inference:
    image: ${DOCKER_REGISTRY}/aithorix/ml-inference:${VERSION}
    environment:
      ENVIRONMENT: production
      MODEL_CACHE_SIZE: 10000
      BATCH_TIMEOUT_MICROS: 10000
      MAX_BATCH_SIZE: 128
      NUM_BATCH_THREADS: 16
      MAX_ENQUEUED_BATCHES: 1000000
    deploy:
      mode: replicated
      replicas: 5
      placement:
        constraints:
          - node.labels.gpu == true
          - node.labels.inference == true
        preferences:
          - spread: node.labels.zone
      resources:
        limits:
          cpus: '16'
          memory: 64G
        reservations:
          cpus: '8'
          memory: 32G
          devices:
            - driver: nvidia
              count: 4
              capabilities: [gpu]
    logging: *production-logging

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aithorix
      POSTGRES_USER: aithorix
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: >-
        -c shared_buffers=8GB
        -c effective_cache_size=24GB
        -c maintenance_work_mem=2GB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c work_mem=104857kB
        -c min_wal_size=1GB
        -c max_wal_size=4GB
        -c max_worker_processes=16
        -c max_parallel_workers_per_gather=8
        -c max_parallel_workers=16
        -c max_parallel_maintenance_workers=8
    volumes:
      - /mnt/nvme/postgres/data:/var/lib/postgresql/data
      - /mnt/nvme/postgres/wal:/var/lib/postgresql/wal
    secrets:
      - db_password
    deploy:
      placement:
        constraints:
          - node.labels.db == primary
      resources:
        limits:
          cpus: '16'
          memory: 32G
        reservations:
          cpus: '8'
          memory: 16G
    logging: *production-logging

  postgres-replica:
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.labels.db == replica
        preferences:
          - spread: node.labels.zone

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass-file /run/secrets/redis_password
      --maxmemory 16gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
      --rdbcompression yes
      --rdbchecksum yes
      --replica-read-only yes
      --repl-diskless-sync yes
      --repl-diskless-sync-delay 5
    volumes:
      - /mnt/nvme/redis/data:/data
    secrets:
      - redis_password
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.cache == primary
      resources:
        limits:
          cpus: '8'
          memory: 20G
        reservations:
          cpus: '4'
          memory: 16G
    logging: *production-logging

  kafka:
    environment:
      KAFKA_HEAP_OPTS: "-Xmx8G -Xms8G"
      KAFKA_JVM_PERFORMANCE_OPTS: >-
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=20
        -XX:InitiatingHeapOccupancyPercent=35
        -XX:+ExplicitGCInvokesConcurrent
        -XX:+AlwaysPreTouch
        -XX:+UseStringDeduplication
      KAFKA_LOG_RETENTION_HOURS: 720  # 30 days
      KAFKA_LOG_RETENTION_BYTES: 107374182400  # 100GB
      KAFKA_NUM_REPLICA_FETCHERS: 4
      KAFKA_NUM_NETWORK_THREADS: 16
      KAFKA_NUM_IO_THREADS: 16
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 1048576
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 1048576
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
    volumes:
      - /mnt/nvme/kafka/data:/var/lib/kafka/data
      - /mnt/nvme/kafka/logs:/var/log/kafka
    deploy:
      mode: replicated
      replicas: 3
      placement:
        preferences:
          - spread: node.labels.zone
      resources:
        limits:
          cpus: '8'
          memory: 16G
        reservations:
          cpus: '4'
          memory: 8G
    logging: *production-logging

  prometheus:
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.retention.size=500GB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - /mnt/ssd/prometheus:/prometheus
    deploy:
      placement:
        constraints:
          - node.labels.monitoring == true
      resources:
        limits:
          cpus: '4'
          memory: 16G
        reservations:
          cpus: '2'
          memory: 8G
    logging: *production-logging

  grafana:
    environment:
      GF_SERVER_ROOT_URL: https://monitoring.aithorix.ai
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD__FILE: /run/secrets/grafana_db_password
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ALERTING_ENABLED: "true"
      GF_UNIFIED_ALERTING_ENABLED: "true"
    secrets:
      - grafana_password
      - grafana_db_password
    deploy:
      placement:
        constraints:
          - node.labels.monitoring == true
      resources:
        limits:
          cpus: '2'
          memory: 4G
    logging: *production-logging

  # =============================================================================
  # PRODUCTION SECURITY
  # =============================================================================

  nginx:
    image: nginx:alpine
    container_name: aithorix-nginx
    volumes:
      - ./infrastructure/config/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - aithorix-network
    depends_on:
      - trading
    deploy:
      mode: global
      placement:
        constraints:
          - node.labels.edge == true
      resources:
        limits:
          cpus: '2'
          memory: 2G
    logging: *production-logging
    restart: always

  certbot:
    image: certbot/certbot
    container_name: aithorix-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    logging: *production-logging

# =============================================================================
# SECRETS
# =============================================================================

secrets:
  db_password:
    external: true
    name: aithorix_db_password
  redis_password:
    external: true
    name: aithorix_redis_password
  grafana_password:
    external: true
    name: aithorix_grafana_password
  grafana_db_password:
    external: true
    name: aithorix_grafana_db_password

# =============================================================================
# PRODUCTION NETWORKS
# =============================================================================

networks:
  aithorix-network:
    driver: overlay
    driver_opts:
      encrypted: "true"
    attachable: true
    ipam:
      config:
        - subnet: 10.0.0.0/24