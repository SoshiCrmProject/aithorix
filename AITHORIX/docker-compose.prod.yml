version: '3.9'

services:
  trading:
    image: aithorix:latest
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  postgres:
    deploy:
      placement:
        constraints:
          - node.role == manager
    volumes:
      - /mnt/data/postgres:/var/lib/postgresql/data

  redis:
    deploy:
      placement:
        constraints:
          - node.role == manager
    volumes:
      - /mnt/data/redis:/data

  nginx:
    image: nginx:alpine
    container_name: aithorix-nginx
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - trading
    deploy:
      placement:
        constraints:
          - node.role == manager
