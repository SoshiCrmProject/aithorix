version: '3.9'

x-common-variables: &common-variables
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  PYTHONUNBUFFERED: 1
  PYTHONOPTIMIZE: 2

x-resource-limits: &resource-limits
  cpus: '2'
  memory: 4G

x-resource-limits-high: &resource-limits-high
  cpus: '4'
  memory: 8G

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

services:
  # =============================================================================
  # CORE SERVICES
  # =============================================================================
  
  trading:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.trading
      args:
        - PYTHON_VERSION=3.11
        - CUDA_VERSION=12.1
    image: aithorix/trading:${VERSION:-latest}
    container_name: aithorix-trading
    hostname: aithorix-trading
    environment:
      <<: *common-variables
      DATABASE_URL: postgresql://aithorix:${DB_PASSWORD}@postgres:5432/aithorix
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - model-weights:/app/data/models/weights
      - /dev/shm:/dev/shm  # Shared memory for IPC
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - aithorix-network
    ports:
      - "${APP_PORT:-8000}:8000"
    deploy:
      resources:
        limits:
          <<: *resource-limits-high
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  ml-inference:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.ml
    image: aithorix/ml-inference:${VERSION:-latest}
    container_name: aithorix-ml-inference
    environment:
      <<: *common-variables
      MODEL_SERVING_PORT: 8501
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0,1,2,3}
    volumes:
      - model-weights:/models:ro
      - ./config/models:/app/config/models:ro
    networks:
      - aithorix-network
    ports:
      - "8501:8501"  # TensorFlow Serving
      - "8502:8502"  # Torch Serve
    deploy:
      resources:
        limits:
          <<: *resource-limits-high
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8501/v1/models"]
    restart: unless-stopped

  # =============================================================================
  # DATA STORES
  # =============================================================================

  postgres:
    image: postgres:16-alpine
    container_name: aithorix-postgres
    environment:
      POSTGRES_DB: aithorix
      POSTGRES_USER: aithorix
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "-c shared_buffers=2GB -c max_connections=200"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/setup/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - aithorix-network
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          <<: *resource-limits
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U aithorix"]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  postgres-replica:
    image: postgres:16-alpine
    container_name: aithorix-postgres-replica
    environment:
      POSTGRES_DB: aithorix
      POSTGRES_USER: aithorix
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_MASTER_SERVICE: postgres
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
    networks:
      - aithorix-network
    ports:
      - "5433:5432"
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          <<: *resource-limits
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aithorix-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    networks:
      - aithorix-network
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: aithorix-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: aithorix
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGO_INITDB_DATABASE: aithorix
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    networks:
      - aithorix-network
    ports:
      - "27017:27017"
    deploy:
      resources:
        limits:
          <<: *resource-limits
    healthcheck:
      <<: *healthcheck-defaults
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/aithorix --quiet
    restart: unless-stopped

  # =============================================================================
  # MESSAGE QUEUE
  # =============================================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: aithorix-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - aithorix-network
    ports:
      - "2181:2181"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "nc", "-z", "localhost", "2181"]
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: aithorix-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - aithorix-network
    ports:
      - "29092:29092"
      - "9092:9092"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
    restart: unless-stopped

  # =============================================================================
  # MONITORING & OBSERVABILITY
  # =============================================================================

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: aithorix-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/metrics/prometheus.rules:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - aithorix-network
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.3.1
    container_name: aithorix-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    networks:
      - aithorix-network
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
    restart: unless-stopped

  # =============================================================================
  # DEVELOPMENT TOOLS (Optional)
  # =============================================================================

  pgadmin:
    image: dpage/pgadmin4:8.2
    container_name: aithorix-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aithorix.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - aithorix-network
    ports:
      - "5050:80"
    profiles:
      - dev
    restart: unless-stopped

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: aithorix-redisinsight
    volumes:
      - redisinsight-data:/db
    networks:
      - aithorix-network
    ports:
      - "8001:8001"
    profiles:
      - dev
    restart: unless-stopped

  jupyter:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.jupyter
    container_name: aithorix-jupyter
    environment:
      <<: *common-variables
      JUPYTER_ENABLE_LAB: "yes"
    volumes:
      - ./:/home/jovyan/work
      - jupyter-data:/home/jovyan/.jupyter
    networks:
      - aithorix-network
    ports:
      - "8888:8888"
    profiles:
      - research
    deploy:
      resources:
        limits:
          <<: *resource-limits-high
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  aithorix-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
    driver_opts:
      com.docker.network.bridge.name: br-aithorix

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  postgres-data:
    driver: local
  postgres-replica-data:
    driver: local
  redis-data:
    driver: local
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local
  kafka-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  model-weights:
    driver: local
  pgadmin-data:
    driver: local
  redisinsight-data:
    driver: local
  jupyter-data:
    driver: local